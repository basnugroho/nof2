version: '3.8'

services:
  alpha:
    build:
      context: .
      dockerfile: Dockerfile
    image: nof2:latest
    container_name: nof2_alpha
    restart: unless-stopped
    ports:
      - "58183:58183"
    volumes:
      - ./data:/opt/app/data
      - ./logs:/opt/app/logs
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    # If you prefer to let host provide secrets as env vars, don't store them in .env in repo.
    # Uncomment and add any necessary env vars here or in a /secure .env on the server.
    # example:
    # - BINANCE_API_KEY=${BINANCE_API_KEY}
    # - BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY}
